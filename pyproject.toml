[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "network-purity-check"
version = "0.1.0"
description = "CLI tool to evaluate network purity for Claude risk"
requires-python = ">=3.11"
dependencies = ["certifi>=2024.2.2"]

[project.scripts]
network-purity-check = "network_purity_check.cli:main"
